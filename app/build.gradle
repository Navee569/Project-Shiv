plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}
android {
    namespace = 'com.shiv.assistant'
    compileSdk 36
    defaultConfig {
        applicationId "com.shiv.assistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures { compose = true; buildConfig = true }
    flavorDimensions += 'connectivity'
    productFlavors {
        create('cloud') {
            dimension 'connectivity'
            buildConfigField 'boolean', 'NETWORK_ALLOWED', 'true'
        }
        create('private') {
            dimension 'connectivity'
            applicationIdSuffix '.private'
            versionNameSuffix '-private'
            buildConfigField 'boolean', 'NETWORK_ALLOWED', 'false'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes { release { minifyEnabled false } }
    sourceSets { androidTest.assets.srcDirs += files("$projectDir/schemas") }
    // Only exported Room schemas will be checked into Git after a verified build.
}
kotlin { jvmToolchain(21) }
dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'net.zetetic:sqlcipher-android:4.19.1'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    // Bundled on-device Latin text recognizer: no network request for OCR.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

// Room version-1 schema is exported for review and future migration verification.
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
