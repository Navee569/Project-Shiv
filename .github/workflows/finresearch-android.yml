name: FinResearch Android MVP APK + tests
on:
  push:
    branches:
      - prototype/finrobot-mobile-20261027
    paths:
      - 'finrobot-mobile/**'
      - '.github/workflows/finresearch-android.yml'
  workflow_dispatch:
concurrency:
  group: finresearch-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inspect runner Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
      - name: Test core, lint and assemble APK
        run: gradle -p finrobot-mobile :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: finresearch-mobile-debug-apk
          path: finrobot-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finresearch-unit-tests
          path: finrobot-mobile/app/build/reports/tests/
          if-no-files-found: ignore

  emulator-smoke-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inspect runner Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
      - name: Install, launch, inspect UI and test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            mkdir -p finrobot-mobile/app/build/reports/androidTests/diagnostics
            trap 'adb logcat -d -v time > finrobot-mobile/app/build/reports/androidTests/diagnostics/logcat.txt || true' EXIT
            gradle -p finrobot-mobile :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            adb install -r finrobot-mobile/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.finresearch.mobile/.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.finresearch.mobile)"
            # The UI-dump file cannot be read by the shell UID on some images.
            # Instrumentation asserts the actual screen content and offline flows.
            gradle -p finrobot-mobile :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finresearch-emulator-test-reports
          path: finrobot-mobile/app/build/reports/androidTests/
          if-no-files-found: ignore
