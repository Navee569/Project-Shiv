name: Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Verify SQLCipher and Keystore persistence on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash .github/scripts/verify-android-persistence.sh
      - name: Upload Android test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            app/build/ci-diagnostics/
            app/build/reports/androidTests/connected/debug/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shiv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
