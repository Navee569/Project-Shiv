name: Shiv Android instrumented security tests
on:
  push:
    branches: ['development/**']
    paths:
      - 'app/**'
      - '.github/workflows/shiv-instrumented.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
      - name: Emulator SQLCipher and privacy tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiv-emulator-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
