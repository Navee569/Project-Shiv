name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/shiv-complete-beta
      - dev/m0-baseline-discovery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Do not request the removed Android SDK "tools" package.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Record toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run debug lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiv-android-verification-reports
          if-no-files-found: warn
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/apk/debug/output-metadata.json
            app/build/outputs/apk/debug/*.apk
