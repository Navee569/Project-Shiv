name: Shiv Native Android
on:
  push:
    branches: [main, 'development/**']
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'scripts/**'
      - 'ci/**'
      - '.github/workflows/shiv-native.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Static safety checks
        run: |
          python3 scripts/verify_shiv.py
          python3 ci/privacy_release_audit.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$ANDROID_HOME"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build native Shiv APK
        run: gradle :app:assembleCloudDebug :app:assemblePrivateDebug --stacktrace --no-daemon
      - name: Inspect merged APK permissions and native libraries
        run: python3 ci/privacy_release_audit.py --private-apk app/build/outputs/apk/private/debug/app-private-debug.apk --cloud-apk app/build/outputs/apk/cloud/debug/app-cloud-debug.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - uses: actions/upload-artifact@v4
        with:
          name: shiv-native-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Test and lint native Shiv
        run: gradle :app:testCloudDebugUnitTest :app:testPrivateDebugUnitTest :app:lintCloudDebug :app:lintPrivateDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shiv-native-test-results
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
