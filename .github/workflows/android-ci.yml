name: Android CI

on:
  push:
    branches:
      - "dev/**"
      - "codex/shiv-complete-beta"
  pull_request:
    branches:
      - main
      - "codex/shiv-complete-beta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null
      - name: Validate Android Studio run configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          config = pathlib.Path(".run/App.run.xml")
          settings = pathlib.Path("settings.gradle.kts")
          app_build = pathlib.Path("app/build.gradle.kts")
          assert config.is_file(), "Missing .run/App.run.xml"
          assert settings.is_file() and app_build.is_file(), "Missing Gradle project/module files"
          root = ET.parse(config).getroot()
          configuration = root.find("configuration")
          assert configuration is not None, "No run configuration found"
          assert configuration.attrib.get("type") == "AndroidRunConfigurationType", "Unexpected run configuration type"
          assert configuration.attrib.get("name") == "Shiv Android", "Unexpected run configuration name"
          module = configuration.find("module")
          assert module is not None and module.attrib.get("name") == "Shiv.app", "Run configuration module must be Shiv.app"
          assert 'include(":app")' in settings.read_text(), "Gradle settings do not include :app"
          assert 'applicationId = "app.shiv"' in app_build.read_text(), "Application ID mismatch"
          print("Run configuration XML valid; Shiv.app module and app.shiv declarations agree.")
          PY
      - name: Record toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew projects
      - name: Build debug APK
        id: build
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Inspect packaged APK manifest and launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -s "$APK"
          test -x "$AAPT"
          mkdir -p app/build/reports/apk-verification
          "$AAPT" dump badging "$APK" | tee app/build/reports/apk-verification/manifest-inspection.txt
          grep -F "package: name='app.shiv'" app/build/reports/apk-verification/manifest-inspection.txt
          grep -F "launchable-activity: name='app.shiv.MainActivity'" app/build/reports/apk-verification/manifest-inspection.txt
          grep -F "label='Shiv'" app/build/reports/apk-verification/manifest-inspection.txt
          grep -E "application-icon-[0-9]+:" app/build/reports/apk-verification/manifest-inspection.txt
          sha256sum "$APK" | tee app/build/reports/apk-verification/apk-sha256.txt
          stat --format="APK bytes: %s" "$APK" | tee app/build/reports/apk-verification/apk-size.txt
      - name: Install and cold-launch APK in Android emulator
        id: emulator_smoke
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -camera-front none
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: |
            set -euo pipefail
            mkdir -p app/build/reports/emulator-smoke
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear app.shiv
            adb shell am force-stop app.shiv
            adb logcat -c
            adb shell am start -W -n app.shiv/.MainActivity | tee app/build/reports/emulator-smoke/launch.txt
            grep -E "Status: ok" app/build/reports/emulator-smoke/launch.txt
            sleep 5
            adb shell pidof app.shiv | tee app/build/reports/emulator-smoke/process.txt
            test -s app/build/reports/emulator-smoke/process.txt
            adb shell dumpsys activity activities > app/build/reports/emulator-smoke/activities.txt
            grep -F "app.shiv/.MainActivity" app/build/reports/emulator-smoke/activities.txt
            adb logcat -d -t 6000 > app/build/reports/emulator-smoke/logcat.txt
            adb logcat -b crash -d > app/build/reports/emulator-smoke/crash-buffer.txt
            if grep -E "Process: app\\.shiv, PID:|ANR in app\\.shiv" app/build/reports/emulator-smoke/logcat.txt app/build/reports/emulator-smoke/crash-buffer.txt; then
              echo "Fatal app crash or ANR detected in fresh emulator logs." >&2
              exit 1
            fi
      - name: Collect emulator boot/smoke diagnostics on failure
        if: always() && steps.emulator_smoke.outcome != 'success'
        shell: bash
        run: |
          mkdir -p app/build/reports/emulator-smoke
          {
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Runner: $(uname -a)"
            echo "Android SDK: ${ANDROID_HOME:-unset}"
            echo "ADB version:"
            adb version || true
            echo "ADB devices:"
            adb devices -l || true
            echo "Emulator processes:"
            ps -ef | grep -E '[e]mulator|[q]emu|[a]db' || true
            echo "SDK emulator binaries:"
            find "${ANDROID_HOME:-/nonexistent}/emulator" -maxdepth 1 -type f -name emulator -ls 2>/dev/null || true
            echo "Device properties (if booted):"
            adb shell getprop 2>&1 || true
          } > app/build/reports/emulator-smoke/boot-diagnostics.txt 2>&1
          adb logcat -d -t 6000 > app/build/reports/emulator-smoke/boot-logcat.txt 2>&1 || true
          adb logcat -b crash -d > app/build/reports/emulator-smoke/boot-crash-buffer.txt 2>&1 || true
          adb shell dumpsys bootstat > app/build/reports/emulator-smoke/bootstat.txt 2>&1 || true
      - name: Run unit tests
        if: always() && steps.build.outcome == 'success'
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Run debug lint
        if: always() && steps.build.outcome == 'success'
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiv-android-verification-reports
          if-no-files-found: warn
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/apk/debug/output-metadata.json
            app/build/outputs/apk/debug/*.apk
            app/build/reports/apk-verification/**
            app/build/reports/emulator-smoke/**
