name: Android CI

on:
  push:
    branches:
      - "dev/**"
      - "codex/shiv-complete-beta"
  pull_request:
    branches:
      - main
      - "codex/shiv-complete-beta"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Record toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew projects

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run debug lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiv-android-verification-reports
          if-no-files-found: warn
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/apk/debug/output-metadata.json
